const chargeRow = (c, i) => `<div class="line" data-ci="${i}"><select data-k="type" id="oc-t-${i}" aria-label="Charge type">${Object.entries(CHARGE_TYPES).map(([k,v])=>`<option value="${k}" ${c.type===k?'selected':''}>${v}</option>`).join('')}</select><input type="number" min="0" step="0.01" data-k="amount" id="oc-a-${i}" value="${c.amount||''}" placeholder="£" aria-label="Amount"><input type="date" data-k="date" id="oc-d-${i}" value="${c.date||today()}" aria-label="Date paid"><button class="btn sm" data-crm="${i}" aria-label="Remove charge">✕</button></div>`;
const readCharges = root => [...root.querySelectorAll('[data-ci]')].map(r=>({type:$('[data-k=type]',r).value, amount:num($('[data-k=amount]',r).value), date:$('[data-k=date]',r).value||today()}));

function lastPrice(pid, origin){
  const os = S.orders.filter(o=>(o.origin||'china')===origin).sort((a,b)=>(b.orderDate||'').localeCompare(a.orderDate||''));
  for (const o of os){ const l = (o.lines||[]).find(l=>l.productId===pid && num(l.unitPrice)>0); if (l) return num(l.unitPrice); }
  return 0;
}

function openOrder(id, originArg){
  const existing = id ? S.orders.find(o=>o.id===id) : null;
  const origin = existing ? (existing.origin||'china') : (originArg||'china');
  const cn = origin==='china';
  const lead = num(S.settings.leadDays)||90, vr = num(S.settings.vatRate ?? 20), incMul = 1 + vr/100;
  const o = existing ? JSON.parse(JSON.stringify(existing)) : {supplier: cn ? (S.settings.chinaSupplier||'') : '', orderNo:'', orderDate:today(), expectedDate:addDays(today(), cn?lead:7), lines:[], shipping:0, processing:0, otherGoods:0, vat:0, vatAuto:true, charges:[], feesPending:cn, pricesIncVat:false, notes:'', status:'ordered'};
  o.charges = o.charges || [];
  if (num(o.duty)) { o.charges.push({type:'duty', amount:num(o.duty), date:o.orderDate}); o.duty = 0; }
  if (cn && num(o.vat)) { o.charges.push({type:'vat', amount:num(o.vat), date:o.orderDate}); o.vat = 0; }
  if (o.feesPending === undefined) o.feesPending = cn && !o.charges.length;
  const mul = o.pricesIncVat ? incMul : 1;
  const show = v => v ? String(Math.round(v*mul*100)/100) : '';
  const qtyOf = pid => (o.lines||[]).filter(l=>l.productId===pid).reduce((a,l)=>a+num(l.qty),0);
  const priceOf = pid => { const ls = (o.lines||[]).filter(l=>l.productId===pid && num(l.qty)); if (ls.length){ const q = ls.reduce((a,l)=>a+num(l.qty),0); return ls.reduce((a,l)=>a+num(l.qty)*num(l.unitPrice),0)/q; } return lastPrice(pid, origin); };
  const isIn = !!existing && (existing.status==='received' || existing.status==='partial');
  const linked = {};
  productList().forEach(p => { const us = existing ? S.units.filter(u=>u.orderId===existing.id && u.productId===p.id) : []; linked[p.id] = {have:us.length, removable:us.filter(u=>u.status==='stock').sort((a,b)=>(b.created||'').localeCompare(a.created||''))}; });
  const rows = productList().map(p=>`<div class="pg-row"><span class="prod"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}<span class="hint">per ${esc(p.unit)}</span></span><input type="number" min="0" step="1" id="pq-${p.id}" value="${qtyOf(p.id)||''}" placeholder="0" aria-label="${esc(p.name)} quantity"><input type="number" min="0" step="0.01" id="pp-${p.id}" value="${show(priceOf(p.id))}" placeholder="£" aria-label="${esc(p.name)} price each">${isIn?`<input type="number" min="0" step="1" id="pr-${p.id}" value="${linked[p.id].have||''}" placeholder="0" aria-label="${esc(p.name)} received">`:''}<span class="num r" id="pl-${p.id}" data-lt></span></div>`).join('');
  modal(`<h2>${existing?'Edit':'New'} ${cn?'China':'UK'} order</h2>
    <p class="hint" style="margin:0">${cn
      ? `Copy the figures from the supplier's confirmation, using the <b>GBP</b> "Order details" box. Don't add duty or import VAT here. Use <b>Add import fees</b> on the order when that bill arrives.`
      : `For orders from UK suppliers. VAT is worked out on goods and delivery, and you can type over it to match the invoice.`}</p>
    ${isIn?'<div class="banner">This order has been received. Fix anything here: quantities ordered, prices, fees and how many actually arrived. Stock and costs update to match when you save.</div>':''}
    <div class="fields">
      <div class="field"><label for="oSup">Supplier</label><input id="oSup" value="${esc(o.supplier||'')}" placeholder="${cn?'Your China supplier':'Supplier name'}"></div>
      <div class="field"><label for="oNo">${cn?'Order number':'Order / invoice number'}</label><input id="oNo" value="${esc(o.orderNo||'')}" placeholder="optional"></div>
      <div class="field"><label for="oDate">Order date</label><input id="oDate" type="date" value="${o.orderDate}"></div>
      <div class="field"><label for="oExp">${cn?'Est. delivery date':'Expected delivery'}</label><input id="oExp" type="date" value="${o.expectedDate}"></div>
    </div>
    ${cn?'':`<div class="fields"><div class="field"><label for="oInc">Prices I'm entering</label><select id="oInc"><option value="0" ${o.pricesIncVat?'':'selected'}>Exclude VAT</option><option value="1" ${o.pricesIncVat?'selected':''}>Include VAT</option></select></div></div>`}
    <div class="pgrid ${isIn?'rcv':''}"><div class="pg-row pg-head"><span>Item</span><span>${isIn?'Ordered':'Qty'}</span><span>£ each</span>${isIn?'<span>Received</span>':''}<span class="r">Total</span></div>${rows}</div>
    <span class="hint">Leave qty blank for anything not on this order.${cn?' Split ink litres by colour.':''} Prices fill in from your last ${cn?'China':'UK'} order.</span>
    <div class="fields">
      <div class="field"><label for="oOther">Other items, not tracked (£)</label><input id="oOther" type="number" min="0" step="0.01" value="${show(o.otherGoods)}" placeholder="e.g. powder"></div>
      <div class="field"><label for="oShip">${cn?'Shipping fee (£)':'Delivery charge (£)'}</label><input id="oShip" type="number" min="0" step="0.01" value="${show(o.shipping)}"></div>
      ${cn?`<div class="field"><label for="oProc">Payment processing fee (£)</label><input id="oProc" type="number" min="0" step="0.01" value="${o.processing||''}"><span class="hint">Under "Payment information"</span></div>`
          :`<div class="field"><label for="oVat">VAT (£)</label><input id="oVat" type="number" min="0" step="0.01" value="${o.vat||''}"><span class="hint" id="oVatHint"></span></div>`}
    </div>
    ${cn && existing ? `<div class="lines">
      <div class="row spread"><span class="label">Import fees · type · amount · date paid</span><button class="btn sm" id="oAddCh">Add import fee</button></div>
      <div id="oCharges" class="lines">${o.charges.map(chargeRow).join('')}</div>
      <label class="row" style="gap:8px"><input type="checkbox" id="oPending" style="width:auto" ${o.feesPending?'checked':''}> Still waiting for import fees on this order</label>
    </div>` : ''}
    ${isIn?`<div id="rcvMsg" hidden></div>
    <div id="rcvShort" class="lines" hidden>
      <span class="label" id="rcvShortTxt"></span>
      <label class="row" style="gap:8px"><input type="radio" name="rcvShort" value="chase" style="width:auto" ${existing.status==='partial'||!(existing.shortClosed||[]).length?'checked':''}> Still to come. Flag the order to chase.</label>
      <label class="row" style="gap:8px"><input type="radio" name="rcvShort" value="close" style="width:auto" ${existing.status!=='partial'&&(existing.shortClosed||[]).length?'checked':''}> Not coming. Close the order short.</label>
    </div>`:''}
    <div class="totals" id="oTot"></div>
    <div class="field"><label for="oNotes">Notes</label><input id="oNotes" value="${esc(o.notes||'')}" placeholder="Tracking number, anything else…"></div>
    <div class="row spread">${existing && !S.units.some(u=>u.orderId===existing.id) ? `<button class="btn danger" id="oDel">Delete order</button>` : existing ? '<span class="hint">Received orders can’t be deleted. Correct them here instead.</span>' : '<span></span>'}<div class="row"><button class="btn" data-close>Cancel</button><button class="btn primary" id="oSave">${existing?'Save order':'Log order'}</button></div></div>`, ov => {
    let vatTouched = !!(existing && !o.vatAuto);
    let expTouched = !!existing;
    const inc = () => !cn && $('#oInc').value === '1';
    const read = () => {
      const div = inc() ? incMul : 1;
      const lines = productList().map(p=>({productId:p.id, qty:num($('#pq-'+p.id).value), unitPrice:num($('#pp-'+p.id).value)}));
      lines.forEach(l => { $('#pl-'+l.productId).textContent = l.qty && l.unitPrice ? money(l.qty*l.unitPrice) : ''; });
      return {
        lines: lines.filter(l=>l.qty>0).map(l=>({...l, unitPrice:Math.round(l.unitPrice/div*10000)/10000})),
        otherGoods: Math.round(num($('#oOther').value)/div*100)/100,
        shipping: Math.round(num($('#oShip').value)/div*100)/100,
        processing: cn ? num($('#oProc').value) : 0,
        charges: cn ? (existing ? readCharges(ov).filter(c=>c.amount>0) : o.charges) : [],
      };
    };
    const rcvPlan = () => { const d = read(); return productList().map(p => ({pid:p.id, ord:d.lines.filter(l=>l.productId===p.id).reduce((a,l)=>a+l.qty,0), want:Math.max(0, Math.floor(num($('#pr-'+p.id).value))), have:linked[p.id].have, removable:linked[p.id].removable})); };
    const updRcv = () => {
      const plan = rcvPlan(), msgs = []; let blocked = false;
      plan.forEach(r => { const dl = r.want - r.have, nm = P(r.pid).short;
        if (dl > 0) msgs.push(`Add ${dl}× ${nm} to stock.`);
        if (dl < 0){ if (-dl > r.removable.length){ blocked = true; msgs.push(`Only ${r.removable.length}× ${nm} from this order are unopened, so at most ${r.removable.length} can be removed. Write off opened ones on the Stock tab instead.`); } else msgs.push(`Remove ${-dl}× ${nm} from stock (newest unopened first).`); }
        if (r.want > r.ord){ blocked = true; msgs.push(`${nm}: received (${r.want}) can't be more than ordered (${r.ord}). Correct the ordered quantity or the received quantity to save.`); }
      });
      const short = plan.filter(r=>r.want < r.ord);
      $('#rcvMsg').hidden = !msgs.length; $('#rcvMsg').className = 'alert ' + (blocked?'crit':'warn'); $('#rcvMsg').innerHTML = `<div class="msg">${msgs.map(esc).join('<br>')}</div>`;
      $('#rcvShort').hidden = !short.length;
      if (short.length) $('#rcvShortTxt').textContent = 'Not all of it arrived: ' + short.map(r=>`${r.ord-r.want}× ${P(r.pid).short}`).join(', ') + ' missing. Is the rest…';
      $('#oSave').disabled = blocked;
    };
    const recalc = () => {
      const d = read();
      let t = orderTotals({...d, vat:0});
      if (!cn){
        if (!vatTouched) $('#oVat').value = t.exVat ? (t.exVat*vr/100).toFixed(2) : '';
        $('#oVatHint').textContent = vatTouched ? 'Entered manually.' : `Auto: ${vr}% of goods + delivery.`;
        t = orderTotals({...d, vat:num($('#oVat').value)});
        $('#oTot').innerHTML = `<span>Goods ex VAT</span><span class="num">${money(t.goods)}</span><span>Delivery ex VAT</span><span class="num">${money(t.ship)}</span><span>VAT</span><span class="num">${money(t.vat)}</span><span class="grand">Total paid</span><span class="grand num">${money(t.total)}</span>`;
      } else {
        const ship = num(d.shipping), proc = num(d.processing);
        let html = `<span>Subtotal</span><span class="num">${money(t.goods)}</span><span>Shipping fee</span><span class="num">${money(ship)}</span><span>Order total</span><span class="num">${money(t.goods+ship)}</span><span>Payment processing fee</span><span class="num">${money(proc)}</span><span class="grand">Amount paid</span><span class="grand num">${money(t.goods+ship+proc)}</span><span class="hint" style="grid-column:1/-1">Should match "Amount paid" on the confirmation.</span>`;
        if (t.duty || t.vat) html += `<span>Import duty &amp; fees</span><span class="num">${money(t.duty)}</span><span>Import VAT</span><span class="num">${money(t.vat)}</span><span class="grand">Total incl. import costs</span><span class="grand num">${money(t.total)}</span>`;
        $('#oTot').innerHTML = html;
      }
      if (isIn) updRcv();
    };
    ov.addEventListener('input', e => {
      if (e.target.id==='oVat') vatTouched = true;
      if (e.target.id==='oExp') expTouched = true;
      if (e.target.id==='oDate' && !expTouched) $('#oExp').value = addDays(e.target.value||today(), cn?lead:7);
      recalc();
    });
    ov.addEventListener('change', recalc);
    if (cn && existing){
      $('#oAddCh', ov).onclick = () => { const ch = readCharges(ov); ch.push({type: ch.some(c=>c.type==='duty') ? 'vat' : 'duty', amount:0, date:today()}); $('#oCharges').innerHTML = ch.map(chargeRow).join(''); recalc(); };
      $('#oCharges', ov).addEventListener('click', e => { const b = e.target.closest('[data-crm]'); if (!b) return; const ch = readCharges(ov); ch.splice(+b.dataset.crm,1); $('#oCharges').innerHTML = ch.map(chargeRow).join(''); recalc(); });
    }
    recalc();
    if (existing && $('#oDel', ov)){ let armed=false; $('#oDel', ov).onclick = async e => { if (!armed){ armed=true; e.target.textContent='Tap again to delete'; return; } if (await write(()=>db.collection('orders').doc(existing.id).delete(), 'Order deleted')) closeModal(); }; }
    $('#oSave', ov).onclick = async () => {
      const d = read();
      if (!d.lines.length && !d.otherGoods){ toast('Enter a quantity for at least one item.'); return; }
      const data = {...d, supplier:$('#oSup').value.trim(), orderNo:$('#oNo').value.trim(), origin, orderDate:$('#oDate').value||today(), expectedDate:$('#oExp').value||addDays(today(), cn?lead:7), duty:0,
        vat: cn ? 0 : num($('#oVat').value), vatAuto: !vatTouched, pricesIncVat: inc(),
        feesPending: cn ? (existing ? $('#oPending').checked : true) : false,
        notes:$('#oNotes').value.trim(), status:o.status||'ordered', receivedDate:o.receivedDate||null};
      const ref = db.collection('orders').doc(existing ? existing.id : 'o'+uid());
      const base = existing ? Object.fromEntries(Object.entries(existing).filter(([k])=>k!=='id')) : {};
      let extra = {}, plan = [];
      if (isIn){
        plan = rcvPlan();
        const mode = (ov.querySelector('input[name=rcvShort]:checked')||{}).value || 'chase';
        const short = plan.filter(r=>r.want < r.ord);
        const deliveries = (existing.deliveries && existing.deliveries.length) ? [...existing.deliveries] : [{date:existing.receivedDate||today(), lines:plan.filter(r=>r.have).map(r=>({productId:r.pid, qty:r.have}))}];
        const delivered = pid => deliveries.reduce((a,dv)=>a+(dv.lines||[]).filter(l=>l.productId===pid).reduce((b,l)=>b+num(l.qty),0),0);
        const adj = plan.map(r=>({productId:r.pid, qty:r.want - delivered(r.pid)})).filter(l=>l.qty);
        if (adj.length) deliveries.push({date:today(), adjustment:true, lines:adj});
        extra = {deliveries, shortClosed: short.length && mode==='close' ? short.map(r=>({productId:r.pid, qty:r.ord-r.want, date:today()})) : [], status: short.length && mode!=='close' ? 'partial' : 'received'};
      }
      const full = {...base, ...data, ...extra};
      const ok = await write(async () => {
        await ref.set(full);
        for (const r of plan){
          const diff = r.want - r.have;
          if (diff > 0){ const c = landedForProduct(full, r.pid); for (let i=0;i<diff;i++) await db.collection('units').doc('u'+uid()).set({productId:r.pid, receivedDate:existing.receivedDate||today(), status:'stock', costExVat:Math.round(c.exVat*100)/100, vat:Math.round(c.vat*100)/100, orderId:existing.id, created:new Date().toISOString()}); }
          if (diff < 0){ for (const u of r.removable.slice(0, -diff)) await db.collection('units').doc(u.id).delete(); }
        }
        if (cn && data.supplier && data.supplier !== (S.settings.chinaSupplier||'')) await db.collection('settings').doc('main').set({leadDays:lead, vatRate:vr, ...S.settings, chinaSupplier:data.supplier});
      }, existing ? 'Order saved' : (cn ? 'China order logged. Add import fees when the bill arrives.' : 'UK order logged'));
      if (ok) closeModal();
    };
  });
}

function openFees(id){
  const o = S.orders.find(x=>x.id===id); if (!o) return;
  const charges = (o.charges||[]).slice();
  if (num(o.duty)) charges.unshift({type:'duty', amount:num(o.duty), date:o.orderDate});
  const t = orderTotals(o);
  modal(`<h2>Add import fees</h2>
    <p style="margin:0">${esc(o.supplier||'Order')} · placed ${fmtDate(o.orderDate)} · goods ${money(t.goods)}</p>
    ${charges.length?`<div class="tablewrap"><table><thead><tr><th>Already added</th><th>Paid</th><th class="r">Amount</th></tr></thead><tbody>${charges.map(c=>`<tr><td>${esc(CHARGE_TYPES[c.type]||c.type)}</td><td class="num">${fmtDate(c.date)}</td><td class="r num">${money(c.amount)}</td></tr>`).join('')}</tbody></table></div>`:''}
    <p class="hint" style="margin:0">Add each line from the courier or HMRC bill. Use one row for duty and one for import VAT so VAT stays separate for your VAT return.</p>
    <div id="fCharges" class="lines">${[{type:'duty'},{type:'vat'}].map((c,i)=>chargeRow({...c, amount:'', date:today()}, i)).join('')}</div>
    <div><button class="btn sm" id="fAdd">Add another fee</button></div>
    <label class="row" style="gap:8px"><input type="checkbox" id="fDone" style="width:auto" checked> That's all the import fees for this order</label>
    <div class="totals" id="fTot"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="fSave">Save fees</button></div>`, ov => {
    const recalc = () => { const add = readCharges(ov).filter(c=>c.amount>0); const t2 = orderTotals({...o, charges:[...(o.charges||[]), ...add]}); $('#fTot').innerHTML = `<span>Fees added now</span><span class="num">${money(add.reduce((a,c)=>a+c.amount,0))}</span><span class="grand">New order total</span><span class="grand num">${money(t2.total)}</span>`; };
    ov.addEventListener('input', recalc); ov.addEventListener('change', recalc);
    $('#fAdd', ov).onclick = () => { const ch = readCharges(ov); ch.push({type:'handling', amount:0, date:today()}); $('#fCharges').innerHTML = ch.map(chargeRow).join(''); recalc(); };
    $('#fCharges', ov).addEventListener('click', e => { const b = e.target.closest('[data-crm]'); if (!b) return; const ch = readCharges(ov); ch.splice(+b.dataset.crm,1); $('#fCharges').innerHTML = ch.map(chargeRow).join(''); recalc(); });
    recalc();
    $('#fSave', ov).onclick = async () => {
      const add = readCharges(ov).filter(c=>c.amount>0);
      const done = $('#fDone').checked;
      if (!add.length && !done){ toast('Enter an amount, or tick that all fees are in.'); return; }
      const ok = await write(()=>db.collection('orders').doc(o.id).update({charges:[...charges, ...add], duty:0, feesPending:!done}), add.length ? `Added ${money(add.reduce((a,c)=>a+c.amount,0))} in import fees` : 'Marked all import fees received');
      if (ok) closeModal();
    };
  });
}

function openReceive(id){
  const o = S.orders.find(x=>x.id===id); if (!o) return;
  const rows = orderPids(o).map(pid => ({pid, ord:orderedQty(o,pid), got:receivedQty(o,pid), out:outstanding(o,pid)})).filter(r=>r.out>0);
  const first = !(o.deliveries||[]).length;
  modal(`<h2>${first?'Receive order':'Receive rest of order'}</h2>
    <p style="margin:0">${esc(o.supplier||'Order')}${o.orderNo?' #'+esc(o.orderNo):''} · placed ${fmtDate(o.orderDate)}</p>
    <p class="hint" style="margin:0">Count what actually arrived. If anything's missing, enter the lower number. The order stays flagged as a part delivery so you can chase the rest.</p>
    <div class="tablewrap"><table><thead><tr><th>Item</th><th class="r">Ordered</th><th class="r">Already in</th><th class="r">Arrived now</th><th class="r">Cost each so far</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="prod"><span class="dot" style="background:${P(r.pid).color}"></span>${esc(P(r.pid).short)}</span></td><td class="r num">${r.ord}</td><td class="r num">${r.got||'—'}</td><td class="r"><input type="number" min="0" max="${r.out}" id="rq-${r.pid}" value="${r.out}" style="width:80px" aria-label="${esc(P(r.pid).short)} arrived now"></td><td class="r num">${money(landedForProduct(o,r.pid).exVat)}</td></tr>`).join('')}</tbody></table></div>
    <div class="fields"><div class="field"><label for="rcDate">Date received (mark this on the items)</label><input id="rcDate" type="date" value="${today()}"></div></div>
    <div id="rcShort" class="alert warn" hidden><div class="msg"></div></div>
    <label class="row" style="gap:8px" id="rcCloseWrap" hidden><input type="checkbox" id="rcClose" style="width:auto"> The rest isn't coming. Close the order and don't flag it.</label>
    ${isChina(o)&&o.feesPending?'<p class="hint" style="margin:0">Import fees aren\'t in yet. When you add them, these item costs update automatically.</p>':''}
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="rcSave">Add to stock</button></div>`, ov => {
    const read = () => rows.map(r=>({productId:r.pid, out:r.out, qty:Math.max(0, Math.min(r.out, Math.floor(num($('#rq-'+r.pid).value))))}));
    const upd = () => {
      const rd = read(), n = rd.reduce((a,l)=>a+l.qty,0), short = rd.filter(l=>l.qty<l.out);
      $('#rcShort').hidden = !short.length; $('#rcCloseWrap').hidden = !short.length;
      const close = short.length && $('#rcClose').checked;
      if (short.length) $('#rcShort .msg').innerHTML = close ? `<b>Closing short.</b> ${esc(short.map(l=>`${l.out-l.qty}× ${P(l.productId).short}`).join(', '))} won't be counted as on order. What you paid is spread over the items that did arrive.` : `<b>Part delivery.</b> Still to come: ${esc(short.map(l=>`${l.out-l.qty}× ${P(l.productId).short}`).join(', '))}. The order will be flagged in Received so you can chase it.`;
      $('#rcSave').textContent = n ? `Add ${n} item${n>1?'s':''} to stock` : (close ? 'Close order' : 'Save');
    };
    ov.addEventListener('input', upd); ov.addEventListener('change', upd); upd();
    $('#rcSave', ov).onclick = async e => {
      const rd = read(), n = rd.reduce((a,l)=>a+l.qty,0), short = rd.filter(l=>l.qty<l.out);
      const close = short.length > 0 && $('#rcClose').checked;
      if (!n && !close){ toast('Enter what arrived, or tick that the rest isn’t coming.'); return; }
      e.target.disabled = true;
      const d = $('#rcDate').value || today();
      const deliveries = [...(o.deliveries||[])];
      if (n) deliveries.push({date:d, lines:rd.filter(l=>l.qty>0).map(l=>({productId:l.productId, qty:l.qty}))});
      const shortClosed = [...(o.shortClosed||[]), ...(close ? short.map(l=>({productId:l.productId, qty:l.out-l.qty, date:d})) : [])];
      const complete = !short.length || close;
      const tmp = {...o, shortClosed};
      const ok = await write(async () => {
        for (const l of rd){ if (!l.qty) continue; const c = landedForProduct(tmp, l.productId);
          for (let i=0;i<l.qty;i++) await db.collection('units').doc('u'+uid()).set({productId:l.productId, receivedDate:d, status:'stock', costExVat:Math.round(c.exVat*100)/100, vat:Math.round(c.vat*100)/100, orderId:o.id, created:new Date().toISOString()}); }
        await db.collection('orders').doc(o.id).update({status: complete?'received':'partial', receivedDate:d, firstReceivedDate:o.firstReceivedDate||d, deliveries, shortClosed});
      }, complete ? (n ? `${n} items added to stock. Order complete.` : 'Order closed') : `${n} items added. Order flagged as part delivered.`);
      if (ok) closeModal(); else e.target.disabled = false;
    };
  });
}

function openChase(id){
  const o = S.orders.find(x=>x.id===id); if (!o) return;
  const ch = o.chases || [];
  modal(`<h2>Log a chase</h2>
    <p style="margin:0">${esc(o.supplier||'Order')}${o.orderNo?' #'+esc(o.orderNo):''} · still to come: <b>${esc(outstandingText(o))}</b></p>
    ${ch.length?`<div class="tablewrap"><table><thead><tr><th>Chased</th><th>Note</th></tr></thead><tbody>${ch.slice().reverse().map(c=>`<tr><td class="num">${fmtDate(c.date)}</td><td style="white-space:normal">${esc(c.note||'')}</td></tr>`).join('')}</tbody></table></div>`:''}
    <div class="fields">
      <div class="field" style="flex:0 1 170px"><label for="chDate">Date</label><input id="chDate" type="date" value="${today()}"></div>
      <div class="field" style="flex:1 1 260px"><label for="chNote">What happened</label><input id="chNote" placeholder="e.g. Messaged supplier, resending 4 rolls"></div>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="chSave">Save chase</button></div>`, ov => {
    $('#chSave', ov).onclick = async () => {
      const entry = {date:$('#chDate').value||today(), note:$('#chNote').value.trim()};
      if (await write(()=>db.collection('orders').doc(o.id).update({chases:[...ch, entry]}), 'Chase logged')) closeModal();
    };
  });
}

async function saveSettings(){
  if (!mgrOk()){ toast('Settings are locked. Enter the management PIN.'); render(); return false; }
  const ok = await write(async () => {
    await db.collection('settings').doc('main').set({leadDays:Math.max(1,num($('#setLead').value)||90), vatRate:num($('#setVat').value), chinaSupplier:$('#setSup').value.trim()});
    for (const p of productList()){
      const minStock = Math.max(0, Math.floor(num($(`[data-min="${p.id}"]`).value)));
      const estDays = p.estDays || null;
      const shelfDays = Math.floor(num($(`[data-shelf="${p.id}"]`).value)) || 180;
      const maxOpenDays = Math.floor(num($(`[data-maxopen="${p.id}"]`).value)) || null;
      if (minStock !== p.minStock || (estDays||null) !== (p.estDays||null) || shelfDays !== (p.shelfDays||180) || maxOpenDays !== (p.maxOpenDays||null)){
        const base = {...p}; delete base.id;
        await db.collection('products').doc(p.id).set({...base, minStock, estDays, shelfDays, maxOpenDays});
      }
    }
  }, 'Settings saved');
  return ok;
}

// ---------- events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-filter],[data-ufilter],[data-oorigin],[data-pexp],[data-jump],[data-showfin]');
  if (!b || b.closest('#modalRoot') && !b.dataset.act) return;
  if (b.dataset.filter){ S.stockFilter = b.dataset.filter; render(); return; }
  if (b.dataset.jump){ const el = document.getElementById('p-'+b.dataset.jump); if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'}); return; }
  if (b.dataset.showfin){ const k = b.dataset.showfin; S.showAllFin.has(k) ? S.showAllFin.delete(k) : S.showAllFin.add(k); render(); return; }
  if (b.dataset.pexp){ const k = b.dataset.pexp; S.priceOpen.has(k) ? S.priceOpen.delete(k) : S.priceOpen.add(k); render(); return; }
  if (b.dataset.oorigin){ S.orderFilter.origin = b.dataset.oorigin; render(); return; }
  if (b.dataset.ufilter){ S.usageFilter = b.dataset.ufilter; render(); return; }
  const id = b.dataset.id;
  switch (b.dataset.act){
    case 'goOrders': return setTab('orders');
    case 'open': return openUseUnit(id);
    case 'finish': return openFinish(id);
    case 'newChina': return openOrder(null,'china');
    case 'newUK': return openOrder(null,'uk');
    case 'editOrder': return openOrder(id);
    case 'receive': return openReceive(id);
    case 'fees': return openFees(id);
    case 'chase': return openChase(id);
    case 'writeoff': return openWriteOff(id);
    case 'saveSettings': return saveSettings();
    case 'lockMgr': mgrUntil = 0; render(); return;
    case 'unlockMgr': return (async () => { const ok = await checkPin($('#setPin').value); if (ok){ render(); toast('Settings unlocked for 10 minutes'); } else { $('#pinErr').textContent = 'Wrong PIN'; $('#setPin').value=''; $('#setPin').focus(); } })();
  }
});

document.addEventListener('change', e => {
  if (e.target.id==='ofYear'){ S.orderFilter.year = e.target.value; render(); }
  if (e.target.id==='perPreset'){ const r = periodRange(); S.period = {preset:e.target.value, from:S.period.from||r[0], to:S.period.to||r[1]}; if (e.target.value==='custom'){ S.period.from = r[0]; S.period.to = r[1]; } savePeriod(); render(); }
  if (e.target.id==='perFrom' && e.target.value){ S.period.from = e.target.value; savePeriod(); render(); }
  if (e.target.id==='perTo' && e.target.value){ S.period.to = e.target.value; savePeriod(); render(); }
});
function savePeriod(){ try { localStorage.setItem('dtf-period', JSON.stringify(S.period)); } catch(e) {} }
try { const p = JSON.parse(localStorage.getItem('dtf-period')||'null'); if (p && p.preset) S.period = p; } catch(e) {}
document.addEventListener('input', e => {
  if (e.target.id!=='ofQ') return;
  S.orderFilter.q = e.target.value; const pos = e.target.selectionStart;
  render(); const q = $('#ofQ'); if (q){ q.focus(); try { q.setSelectionRange(pos,pos); } catch(_){} }
});

// ---------- Supabase storage (same calls the page used before) ----------
const TABLES = {products:'dtf_products', units:'dtf_units', orders:'dtf_orders', settings:'dtf_settings'};
function makeDb(client){
  const listeners = {}, cache = {}, timers = {}, channels = {};
  const emit = name => {
    const docs = [...(cache[name] || new Map()).entries()].map(([id, d]) => ({id, exists:true, data:() => d}));
    (listeners[name] || new Set()).forEach(fn => { try { fn({docs, size:docs.length, empty:!docs.length}); } catch(e){ console.error(e); } });
  };
  const load = async name => {
    const rows = []; let from = 0;
    for (;;){
      const {data, error} = await client.from(TABLES[name]).select('id,data').range(from, from + 999);
      if (error) throw error;
      rows.push(...data); if (data.length < 1000) break; from += 1000;
    }
    cache[name] = new Map(rows.map(r => [r.id, r.data])); emit(name);
  };
  const reload = name => { clearTimeout(timers[name]); timers[name] = setTimeout(() => load(name).catch(console.error), 300); };
  const fail = error => { console.error(error); throw {code: error && error.code === '42501' ? 'invalid_argument' : 'unavailable', message: error && error.message}; };
  return {
    collection(name){
      const table = TABLES[name];
      return {
        doc(id){
          return {
            async set(data){ const {error} = await client.from(table).upsert({id, data}); if (error) fail(error); (cache[name] ||= new Map()).set(id, data); emit(name); },
            async update(patch){
              let base = cache[name] && cache[name].get(id);
              if (!base){ const r = await client.from(table).select('data').eq('id', id).maybeSingle(); if (r.error) fail(r.error); base = r.data && r.data.data; }
              if (!base) throw {code:'invalid_argument', message:'Record not found'};
              const data = {...base, ...patch};
              const {error} = await client.from(table).update({data}).eq('id', id); if (error) fail(error);
              (cache[name] ||= new Map()).set(id, data); emit(name);
            },
            async delete(){ const {error} = await client.from(table).delete().eq('id', id); if (error) fail(error); cache[name] && cache[name].delete(id); emit(name); }
          };
        },
        onSnapshot(next, onErr){
          (listeners[name] ||= new Set()).add(next);
          load(name).catch(e => { console.error(e); onErr && onErr(e); });
          if (!channels[name]) channels[name] = client.channel('rt-' + table).on('postgres_changes', {event:'*', schema:'public', table}, () => reload(name)).subscribe();
          return () => listeners[name].delete(next);
        }
      };
    }
  };
}
const sb = (window.supabase && SUPABASE_URL.startsWith('http')) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

async function start(){
  S.ready = false; render();
  db = makeDb(sb);
  const got = {};
  const done = k => { got[k] = true; if (got.p && got.u && got.o && got.s) S.ready = true; render(); };
  setTimeout(() => { if (!S.ready){ S.ready = true; render(); } }, 6000);
  const onErr = () => { S.ready = true; S.notice = 'Some records couldn’t load. Check your connection and reload the page.'; render(); };
  db.collection('products').onSnapshot(snap => { const m = {}; snap.docs.forEach(d=>{ m[d.id] = {id:d.id, ...d.data()}; }); S.products = m; done('p'); }, onErr);
  db.collection('units').onSnapshot(snap => { S.units = snap.docs.map(d=>({id:d.id, ...d.data()})); done('u'); }, onErr);
  db.collection('orders').onSnapshot(snap => { S.orders = snap.docs.map(d=>({id:d.id, ...d.data()})); done('o'); }, onErr);
  db.collection('settings').onSnapshot(snap => { const d = snap.docs.find(x=>x.id==='main'); if (d) S.settings = {leadDays:90, vatRate:20, ...d.data()}; done('s'); }, onErr);
}

// ---------- sign in ----------
const showLogin = on => { $('#login').hidden = !on; $('#signOut').hidden = on; };
const toEmail = u => { u = u.trim().toLowerCase(); return u.includes('@') ? u : u + '@' + USERNAME_DOMAIN; };
let started = false;
function enter(session){
  showLogin(false);
  const em = (session.user && session.user.email) || '';
  $('#whoami').textContent = em.endsWith('@' + USERNAME_DOMAIN) ? em.split('@')[0] : em;
  if (!started){ started = true; start(); }
}
async function boot(){
  if (!sb){ S.ready = true; S.notice = 'Not connected: add your Supabase project URL and key at the top of index.html.'; render(); return; }
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#lgBtn'); btn.disabled = true; btn.textContent = 'Signing in…'; $('#lgErr').hidden = true;
    const {data, error} = await sb.auth.signInWithPassword({email: toEmail($('#lgUser').value), password: $('#lgPass').value});
    btn.disabled = false; btn.textContent = 'Sign in';
    if (error){ $('#lgErr').hidden = false; $('#lgErr .msg').textContent = 'Wrong username or password.'; $('#lgPass').value = ''; return; }
    enter(data.session);
  });
  $('#signOut').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
  sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT') location.reload(); });
  const {data} = await sb.auth.getSession();
  if (data.session) enter(data.session); else { showLogin(true); $('#lgUser').focus(); }
}
boot();
})();
